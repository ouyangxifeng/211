<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>晋家帝 - 个人主页</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    scroll-behavior: smooth;
  }

  :root {
    --main: #38bdf8;
    --main-2: #8b5cf6;
    --bg: #0b1120;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: #e2e8f0;
  }
  .light-mode{
    --main:#0284c7;
    --main-2:#7c3aed;
    --bg:#f8fafc;
    --card:rgba(255,255,255,0.7);
    --border:rgba(0,0,0,0.1);
    --text:#1e293b;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
  }

  /* 鼠标跟随光晕 */
  .cursor-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(
        700px circle at var(--x, 50%) var(--y, 50%),
        rgba(56, 189, 248, 0.12),
        transparent 40%
      );
  }
  .light-mode .cursor-glow{
    background:radial-gradient(700px circle at var(--x, 50%) var(--y, 50%), rgba(56,189,248,0.08), transparent 40%);
  }

  /* 动态背景粒子 */
  #particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* 导航栏 */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    backdrop-filter: blur(12px);
    background: rgba(11, 17, 32, 0.45);
    border-bottom: 1px solid transparent;
    transition: 0.35s ease;
  }
  .light-mode nav{
    background:rgba(248,250,252,0.55);
  }

  nav.scrolled {
    background: rgba(11, 17, 32, 0.85);
    border-bottom-color: var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }
  .light-mode nav.scrolled{
    background:rgba(248,250,252,0.85);
  }

  .nav-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--main), var(--main-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .nav-links a {
    color: var(--text);
    text-decoration: none;
    margin-left: 28px;
    font-size: 15px;
    position: relative;
    transition: 0.3s;
  }

  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--main), var(--main-2));
    transition: 0.3s;
  }

  .nav-links a:hover {
    color: var(--main);
  }

  .nav-links a:hover::after {
    width: 100%;
  }
  #themeBtn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-left:20px;
    transition:0.3s;
  }
  #themeBtn:hover{
    border-color:var(--main);
  }

  /* 首屏 */
  .hero {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 1200px;
    margin: 0 auto;
    gap: 60px;
    padding: 100px 24px 40px;
  }

  .avatar-wrap {
    position: relative;
  }

  .avatar {
    width: 300px;
    height: 380px;
    object-fit: cover;
    border-radius: 20px;
    border: 2px solid var(--border);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
    position: relative;
    z-index: 2;
  }

  .glow {
    position: absolute;
    width: 300px;
    height: 380px;
    border-radius: 20px;
    background: linear-gradient(45deg, var(--main), var(--main-2));
    filter: blur(25px);
    opacity: 0.35;
    z-index: 1;
    top: 14px;
    left: 14px;
    animation: glowMove 6s ease-in-out infinite;
  }

  @keyframes glowMove {
    0%, 100% { transform: translate(0, 0); opacity: 0.3; }
    50% { transform: translate(-8px, 12px); opacity: 0.5; }
  }

  .hero-text h1 {
    font-size: 44px;
    margin-bottom: 14px;
    background: linear-gradient(90deg, #ffffff, var(--main));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .light-mode .hero-text h1{
    background: linear-gradient(90deg, #0f172a, var(--main));
    -webkit-background-clip: text;
    background-clip: text;
  }
  .type-cursor{
    display:inline-block;
    width:3px;
    height:42px;
    background-color:var(--main);
    margin-left:4px;
    animation: blink 0.7s infinite;
    vertical-align:bottom;
  }
  @keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0;}
  }

  .hero-text .tip {
    color: var(--main);
    font-size: 19px;
    margin-bottom: 22px;
    letter-spacing: 1px;
  }

  .hero-text p {
    max-width: 520px;
    line-height: 1.8;
    color: #94a3b8;
    font-size: 16px;
    margin-bottom: 28px;
  }
  .light-mode .hero-text p{
    color:#475569;
  }

  .btn-group a {
    display: inline-block;
    text-decoration: none;
    padding: 12px 26px;
    border-radius: 10px;
    margin-right: 14px;
    font-weight: 500;
    transition: 0.3s;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--main), var(--main-2));
    color: #fff;
    box-shadow: 0 10px 24px rgba(56, 189, 248, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 34px rgba(56, 189, 248, 0.45);
  }

  .btn-outline {
    border: 1px solid var(--main);
    color: var(--main);
    background: transparent;
  }

  .btn-outline:hover {
    background: rgba(56, 189, 248, 0.12);
    transform: translateY(-4px);
  }

  /* 通用区块 */
  .section {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 100px 24px;
  }

  .section-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 48px;
    position: relative;
  }

  .section-title::after {
    content: "";
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--main), var(--main-2));
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: -12px;
    border-radius: 2px;
  }

  /* 滚动渐入 */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: 0.9s ease;
  }

  .reveal.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* 卡片3D倾斜容器 */
  .tilt-card{
    transform-style: preserve-3d;
    transform: perspective(1000px);
  }
  .tilt-card > div{
    transition: transform 0.15s ease-out;
  }

  /* 关于我 */
  .about-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }

  .about-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px;
    backdrop-filter: blur(8px);
  }

  .about-card h3 {
    font-size: 22px;
    margin-bottom: 16px;
    color: #fff;
  }
  .light-mode .about-card h3{
    color:#0f172a;
  }

  .about-card p {
    line-height: 1.8;
    color: #94a3b8;
  }
  .light-mode .about-card p{
    color:#475569;
  }

  /* 技能 */
  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }

  .skill-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }

  .skill-item h4 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #fff;
  }
  .light-mode .skill-item h4{
    color:#0f172a;
  }

  .skill-item p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.6;
  }
  .light-mode .skill-item p{
    color:#475569;
  }

  /* 项目 */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }

  .project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
  }

  .project-body {
    padding: 24px;
  }

  .project-body h4 {
    font-size: 20px;
    margin-bottom: 10px;
    color:#fff;
  }
  .light-mode .project-body h4{
    color:#0f172a;
  }

  .project-body p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .light-mode .project-body p{
    color:#475569;
  }

  .project-tag {
    display: inline-block;
    padding: 4px 10px;
    background: rgba(56, 189, 248, 0.12);
    color: var(--main);
    border-radius: 6px;
    font-size: 12px;
    margin-right: 6px;
    margin-bottom: 6px;
  }

  /* 联系 */
  .contact-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px;
    text-align: center;
  }

  .contact-box p {
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .light-mode .contact-box p{
    color:#475569;
  }

  .contact-box a {
    color: var(--main);
    text-decoration: none;
    font-size: 17px;
    margin: 0 12px;
    transition: 0.3s;
  }

  .contact-box a:hover {
    color: var(--main-2);
  }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 30px;
    color: #64748b;
    font-size: 14px;
    border-top: 1px solid var(--border);
  }

  /* 移动端 */
  @media (max-width: 768px) {
    .nav-links {
      display: none;
    }

    .hero {
      flex-direction: column;
      text-align: center;
    }

    .about-wrap {
      grid-template-columns: 1fr;
    }

    .hero-text h1 {
      font-size: 32px;
    }

    .avatar {
      width: 240px;
      height: 300px;
    }

    .glow {
      width: 240px;
      height: 300px;
    }
  }
</style>
</head>

<body>

<div class="cursor-glow" id="cursorGlow"></div>
<canvas id="particles"></canvas>

<!-- 导航 -->
<nav id="navbar">
  <div class="nav-wrap">
    <div class="logo">晋家帝 · Portfolio</div>
    <div style="display:flex;align-items:center">
      <div class="nav-links">
        <a href=" ">首页</a >
        <a href="#about">关于我</a >
        <a href="#skill">技能</a >
        <a href="#project">项目</a >
        <a href="#contact">联系</a >
      </div>
      <button id="themeBtn">切换主题</button>
    </div>
  </div>
</nav>

<!-- 首屏 --
